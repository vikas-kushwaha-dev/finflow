services:
  postgres:
    image: postgres:18-alpine
    container_name: finflow-postgres
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
      POSTGRES_DB: finflow
    ports:
      - "5432:5432"
    volumes:
      - finflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: finflow-migrate
    command: ["/app/migrate"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://finflow:finflow@postgres:5432/finflow?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      API_KEY: local-dev-api-key-change-me
      MAX_REQUEST_BODY_BYTES: 1048576
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: finflow-payment-service
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://finflow:finflow@postgres:5432/finflow?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      API_KEY: local-dev-api-key-change-me
      MAX_REQUEST_BODY_BYTES: 1048576
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  finflow-postgres-data:
