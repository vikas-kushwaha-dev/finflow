services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: finflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:18-alpine
    container_name: finflow-postgres
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
      POSTGRES_DB: finflow
    ports:
      - "5432:5432"
    volumes:
      - finflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: finflow-migrate
    command: ["/app/migrate"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://finflow:finflow@postgres:5432/finflow?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      API_KEY: local-dev-api-key-change-me
      MAX_REQUEST_BODY_BYTES: 1048576
      KAFKA_BROKERS: kafka:9092
      PAYMENT_EVENTS_TOPIC: finflow.payment.events
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: finflow-payment-service
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://finflow:finflow@postgres:5432/finflow?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      API_KEY: local-dev-api-key-change-me
      MAX_REQUEST_BODY_BYTES: 1048576
      KAFKA_BROKERS: kafka:9092
      PAYMENT_EVENTS_TOPIC: finflow.payment.events
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  outbox-publisher:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: finflow-outbox-publisher
    command: ["/app/outbox-publisher"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://finflow:finflow@postgres:5432/finflow?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      API_KEY: local-dev-api-key-change-me
      MAX_REQUEST_BODY_BYTES: 1048576
      KAFKA_BROKERS: kafka:9092
      PAYMENT_EVENTS_TOPIC: finflow.payment.events
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  ledger-consumer:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    container_name: finflow-ledger-consumer
    command: ["/app/payment-consumer"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://finflow:finflow@postgres:5432/finflow?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      PAYMENT_EVENTS_TOPIC: finflow.payment.events
      LEDGER_CONSUMER_GROUP_ID: ledger-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  finflow-postgres-data:
