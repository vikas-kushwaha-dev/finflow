services:
  postgres:
    image: postgres:18-alpine
    container_name: finflow-postgres
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
      POSTGRES_DB: finflow
    ports:
      - "5432:5432"
    volumes:
      - finflow-postgres-data:/var/lib/postgresql/data
      - ./migrations/000001_create_payments.up.sql:/docker-entrypoint-initdb.d/001_create_payments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finflow-postgres-data:

