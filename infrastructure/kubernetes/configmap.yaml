apiVersion: v1
kind: ConfigMap
metadata:
  name: finflow-config
data:
  APP_ENV: production
  GATEWAY_HTTP_ADDR: ":8088"
  HTTP_ADDR: ":8080"
  LEDGER_HTTP_ADDR: ":8081"
  MIGRATIONS_DIR: /app/migrations
  MAX_REQUEST_BODY_BYTES: "1048576"
  PAYMENT_SERVICE_URL: http://payment-service:8080
  LEDGER_SERVICE_URL: http://ledger-service:8081
  GATEWAY_RATE_LIMIT_REQUESTS: "120"
  GATEWAY_RATE_LIMIT_WINDOW: 1m
  KAFKA_BROKERS: kafka.example.com:9092
  PAYMENT_EVENTS_TOPIC: finflow.payment.events
  LEDGER_CONSUMER_GROUP_ID: ledger-service
