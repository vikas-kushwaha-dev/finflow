apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-consumer
  labels:
    app.kubernetes.io/name: ledger-consumer
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: finflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-consumer
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
      labels:
        app.kubernetes.io/name: ledger-consumer
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: finflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-consumer
          image: finflow/ledger-service:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/payment-consumer"]
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: APP_ENV
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: METRICS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: METRICS_ADDR
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: KAFKA_BROKERS
            - name: PAYMENT_EVENTS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: PAYMENT_EVENTS_TOPIC
            - name: LEDGER_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: LEDGER_CONSUMER_GROUP_ID
            - name: LEDGER_DEAD_LETTER_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: LEDGER_DEAD_LETTER_TOPIC
            - name: LEDGER_CONSUMER_MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: LEDGER_CONSUMER_MAX_ATTEMPTS
            - name: LEDGER_RETRY_INITIAL_BACKOFF
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: LEDGER_RETRY_INITIAL_BACKOFF
            - name: LEDGER_RETRY_MAX_BACKOFF
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: LEDGER_RETRY_MAX_BACKOFF
            - name: KAFKA_REQUIRE_SECURE_TRANSPORT
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: KAFKA_REQUIRE_SECURE_TRANSPORT
            - name: KAFKA_TLS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: KAFKA_TLS_ENABLED
            - name: KAFKA_TLS_CA_FILE
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: KAFKA_TLS_CA_FILE
            - name: KAFKA_TLS_SERVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: KAFKA_TLS_SERVER_NAME
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: KAFKA_SASL_MECHANISM
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: finflow-kafka-auth
                  key: username
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finflow-kafka-auth
                  key: password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finflow-secrets
                  key: database-url
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: finflow-secrets
                  key: internal-service-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/finflow/kafka
              readOnly: true
      volumes:
        - name: kafka-ca
          secret:
            secretName: finflow-kafka-tls
            items:
              - key: ca.crt
                path: ca.crt
      terminationGracePeriodSeconds: 30
