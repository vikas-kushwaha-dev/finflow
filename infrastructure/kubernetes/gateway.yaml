apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: finflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: finflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: finflow/gateway-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: APP_ENV
            - name: GATEWAY_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: GATEWAY_HTTP_ADDR
            - name: MAX_REQUEST_BODY_BYTES
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: MAX_REQUEST_BODY_BYTES
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: PAYMENT_SERVICE_URL
            - name: LEDGER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: LEDGER_SERVICE_URL
            - name: GATEWAY_RATE_LIMIT_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: GATEWAY_RATE_LIMIT_REQUESTS
            - name: GATEWAY_RATE_LIMIT_WINDOW
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: GATEWAY_RATE_LIMIT_WINDOW
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: finflow-secrets
                  key: api-key
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: finflow-secrets
                  key: internal-service-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: finflow
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
