apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: finflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: finflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment-service
          image: finflow/payment-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: APP_ENV
            - name: HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: HTTP_ADDR
            - name: MIGRATIONS_DIR
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: MIGRATIONS_DIR
            - name: MAX_REQUEST_BODY_BYTES
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: MAX_REQUEST_BODY_BYTES
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: KAFKA_BROKERS
            - name: PAYMENT_EVENTS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: finflow-config
                  key: PAYMENT_EVENTS_TOPIC
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finflow-secrets
                  key: database-url
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: finflow-secrets
                  key: internal-service-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: finflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - name: http
      port: 8080
      targetPort: http
