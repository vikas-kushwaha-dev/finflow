name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Required checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  scan:
    name: Scan (${{ matrix.image }})
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: payment-service
            dockerfile: services/payment-service/Dockerfile
          - image: ledger-service
            dockerfile: services/ledger-service/Dockerfile
          - image: gateway-service
            dockerfile: services/gateway-service/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use semantic version form, for example v1.2.3"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build scan image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          tags: finflow-scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=scan-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.image }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finflow-scan/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish (${{ matrix.image }})
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: payment-service
            dockerfile: services/payment-service/Dockerfile
          - image: ledger-service
            dockerfile: services/ledger-service/Dockerfile
          - image: gateway-service
            dockerfile: services/gateway-service/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/finflow-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=FinFlow ${{ matrix.image }}
            org.opencontainers.image.description=FinFlow ${{ matrix.image }} release image

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=publish-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image }}

      - name: Record immutable digest
        shell: bash
        run: |
          mkdir -p digests
          printf '%s' '${{ steps.build.outputs.digest }}' > 'digests/${{ matrix.image }}.digest'

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}.digest
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release manifests
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: dist/digests
          merge-multiple: true

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render digest-pinned manifests
        shell: pwsh
        run: |
          ./scripts/render-release-manifests.ps1 `
            -Registry "ghcr.io/${{ github.repository_owner }}" `
            -GatewayDigest (Get-Content dist/digests/gateway-service.digest -Raw) `
            -PaymentDigest (Get-Content dist/digests/payment-service.digest -Raw) `
            -LedgerDigest (Get-Content dist/digests/ledger-service.digest -Raw) `
            -OutputDirectory dist/release

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: finflow-${{ github.ref_name }}
          path: dist/release
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "FinFlow ${GITHUB_REF_NAME}"
          fi
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            dist/release/finflow-kubernetes.yaml \
            dist/release/finflow-migration.yaml \
            dist/release/release-metadata.json
