name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Test and build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/payment-service
          - services/ledger-service
          - services/gateway-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build commands
        run: go build ./cmd/...

  compose:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize infrastructure/kubernetes > /dev/null
          kubectl kustomize infrastructure/kubernetes/migration > /dev/null

      - name: Validate release manifest renderer
        shell: pwsh
        run: |
          $gatewayDigest = "sha256:" + ("a" * 64)
          $paymentDigest = "sha256:" + ("b" * 64)
          $ledgerDigest = "sha256:" + ("c" * 64)
          ./scripts/render-release-manifests.ps1 `
            -Registry "ghcr.io/vikas-kushwaha-dev" `
            -GatewayDigest $gatewayDigest `
            -PaymentDigest $paymentDigest `
            -LedgerDigest $ledgerDigest `
            -OutputDirectory "dist/ci-release"

          if (Select-String -Path "dist/ci-release/*.yaml" -Pattern "finflow/.+-service:dev" -Quiet) {
            throw "development image reference remained in release manifests"
          }
